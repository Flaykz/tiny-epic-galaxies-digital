name: Deploy to GitHub Pages

# Static-only deploy: everything (local hotseat, vs AI, solo-vs-Rogue-Galaxy)
# runs entirely in the browser, so GitHub Pages is enough.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Never redistribute the copyrighted VASSAL-derived art — the deployed
          # app shows its own "bring your own module" dialog instead (see README).
          DBF_NO_ASSETS: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
